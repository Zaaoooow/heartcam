<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>那些年 · 快拍三连</title>
<link rel="stylesheet" href="styles.css?v=8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<script type="module" src="scripts/app.js?v=8" defer></script>
</head>
<body>

<div id="viewfinder-container">
  <header id="top-bar">
    <div id="album-navigation" class="nav-cluster"></div>
    <div id="viewfinder-mode-switcher">
      <span class="mode-label active" data-mode="photo" data-i18n="mode_photo">拍照</span><span class="mode-sep">丨</span><span class="mode-label" data-mode="gallery" data-i18n="mode_gallery">相册</span><span class="mode-sep">丨</span><span class="mode-label" data-mode="about" data-i18n="mode_about">关于</span>
    </div>
    <div id="top-right-icons">
      <button id="lang-toggle" title="切换语言" data-i18n-title="lang_title">EN</button>
      <button id="grid-overlay-toggle" aria-label="grid" title="切换九宫格" data-i18n-title="grid_title">⊞</button>
      <button id="mute-toggle" aria-label="sound" title="切换静音" data-i18n-title="mute_title">🔊</button>
    </div>
  </header>

  <div id="tagline" data-i18n="tagline">③ 连拍 ▸ 相纸卡打印 ▸ 底部盖日期章</div>

  <main>
    <section id="viewfinder-screen">
      <video id="camera-feed" playsinline autoplay muted></video>
      <div id="camera-loading-overlay" class="screen-overlay-message">
        <div class="cute-icon">♡</div>
        <h4 data-i18n="loading_h4">请求摄像头权限…</h4>
        <p data-i18n-html="loading_p">浏览器需要你的同意才能开始取景哦。<br>如果已拒绝，请到浏览器地址栏的权限设置里重新允许。</p>
      </div>
      <div id="camera-error-overlay" class="screen-overlay-message hidden">
        <div class="cute-icon">☁</div>
        <h4 data-i18n="err_h4">取景失败</h4>
        <p id="camera-error-message">出现了一点问题，请检查摄像头再试试看。</p>
        <button id="retry-camera-btn" class="pretty-button" data-i18n="retry">再试一次</button>
      </div>
      <div id="viewfinder-grid-lines" class="hidden">
        <span class="grid-line-v"></span><span class="grid-line-v"></span>
        <span class="grid-line-h"></span><span class="grid-line-h"></span>
      </div>
      <div id="countdown-display-overlay" class="hidden"><span id="countdown-value">3</span></div>
      <div id="shot-progress-overlay" class="hidden"><span id="shot-progress-text">📸 快拍 1 / 3</span></div>
      <div id="flash-effect-overlay"></div>
      <div id="pre-flash-effect-overlay"></div>
    </section>

    <div id="shutter-hud">
      <div id="hud-left">
        <label id="flash-selector" class="hud-pill" title="Flash" data-flash-state="on">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 2h11l-3 7h4L8 23l2.5-9H7z"/></svg>
          <span data-i18n="hud_flash">闪光</span>
        </label>
        <label id="countdown-selector" class="hud-pill" title="Timer" data-countdown="3">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l2.5 2" stroke="#fff" stroke-width="1.6" fill="none"/><path d="M9 2h6v3H9z"/></svg>
          <span data-i18n="hud_countdown">延时</span>
        </label>
      </div>
      <button id="shutter-button" aria-label="photo" data-i18n-title="shutter_label">
        <div class="shutter-inner"></div>
      </button>
      <div id="hud-right">
        <label id="camera-switcher" class="hud-pill" title="Flip">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 5a7 7 0 016.9 6H21l-3.5 4L14 11h2.8A5 5 0 007 12.9L5.4 14A7 7 0 0112 5z"/></svg>
          <span data-i18n="hud_flip">翻转</span>
        </label>
        <label id="aspect-selector" class="hud-pill" title="Aspect">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="3" y="6" width="18" height="12" rx="1.5"/></svg>
          <span id="aspect-ratio-label">4:3</span>
        </label>
      </div>
    </div>
  </main>

  <section id="gallery-screen" class="hidden">
    <h2 class="section-title"><span class="accent">♥</span> <span data-i18n="album_title">我的相册</span></h2>
    <div id="gallery-navigation" class="nav-cluster"></div>
    <div id="gallery-grid"></div>
    <div id="gallery-empty-state" class="hidden screen-overlay-message">
      <div class="cute-icon">📷</div>
      <h4 data-i18n="album_empty_h4">相册里空空的</h4>
      <p data-i18n="album_empty_p">快去拍点照片存进来吧 ♥</p>
    </div>
  </section>

  <section id="about-screen" class="hidden">
    <h2 class="section-title"><span class="accent">♥</span> <span data-i18n="about_title">关于小站</span></h2>
    <div class="about-card">
      <p data-i18n-html="about_p1"></p>
      <ul>
        <li data-i18n="about_li1"></li>
        <li data-i18n="about_li2"></li>
        <li data-i18n="about_li3"></li>
      </ul>
      <p class="footer-note" data-i18n-html="about_footer"></p>
    </div>
  </section>
</div>

<div id="captured-photo-preview-overlay" class="hidden">
  <div id="captured-photo-card">
    <img id="captured-photo-img" src="">
    <div class="caption-bar" data-i18n="caption">三连拍完成，收好这张纸 ♥</div>
    <div class="photo-actions">
      <button id="save-photo-btn" class="pretty-button" data-i18n="save">保存到相册</button>
      <button id="discard-photo-btn" class="pretty-button subtle" data-i18n="discard">不要啦</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<div id="build-badge">build v8</div>
<div id="lightbox-overlay" class="hidden">
  <img id="lightbox-img" src="">
  <div class="lightbox-actions">
    <a id="lightbox-download-btn" class="pretty-button" download data-i18n="dl">下载原图</a>
    <button id="lightbox-close-btn" class="pretty-button subtle" data-i18n="close">关闭</button>
  </div>
</div>
</body>
</html>
